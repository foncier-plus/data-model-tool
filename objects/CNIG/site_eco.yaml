name: site_eco
description: "Les sites économiques comprennent les Zones d'activité économique (ZAE), les sites économiques historiques hors ZAE, les établissements isolés et les réserves foncières."

attributes:
  - name: site_id
    type: string
    description: "Identifiant du site économique (clé primaire)."
  - name: pole_id
    type: string
    description: "Identifiant du pôle où se situe le site économique."
    origin:
      from: [pole_eco.pole_id]
      formula: dsdf
  - name: site_nom
    type: string
    description: "Nom du site économique."
  - name: site_type
    type: string
    description: "Type de site économique."
  - name: site_vocadomi
    type: string
    description: "Vocation dominante constatée du site économique."
  - name: site_etat
    type: string
    description: "État du site économique (en projet, création, etc.)."
  - name: site_surf_brute
    type: number
    description: "Superficie totale du site économique en hectare."
  - name: site_surf_utile
    type: number
    description: "Surface (en hectare) destinée à accueillir les implantations d'activités."
  - name: site_creation_date
    type: string
    description: "Année de création du site économique (YYYY)."
  - name: site_identif_date
    type: string
    description: "Date d'identification du site économique."
  - name: site_actu_date
    type: string
    description: "Date de dernière actualisation des informations sur le site économique."
  - name: site_description
    type: string
    description: "Commentaire libre contenant des infos descriptives du site économique."
  - name: source_producteur
    type: string
    description: "Identification du producteur de la donnée."
  - name: site_quali_territoire
    type: string
    description: "Qualification ou labellisation territoriale ou régionale."
  - name: site_evol_urba
    type: string
    description: "Type d'urbanisation (extension, renouvellement urbain)."
  - name: site_url
    type: string
    description: "URL de la page web descriptive du site économique."
  - name: site_epci_nom
    type: string
    description: "Nom de l'EPCI autorité compétente de la ZAE (obligatoire si ZAE)."
  - name: site_epci_siren
    type: string
    description: "Code SIREN de l'EPCI autorité compétente de la ZAE (obligatoire si ZAE)."
  - name: site_comm_nom
    type: string
    description: "Nom de la commune dont le site occupe la plus grande superficie."
  - name: site_comm_insee
    type: string
    description: "Code INSEE de la commune principale d'implantation du site économique."
  - name: site_moa_type
    type: string
    description: "Type de maîtrise d'ouvrage."
  - name: site_moa_nom
    type: string
    description: "Nom de la maîtrise d'ouvrage et/ou gestionnaire du site économique."
  - name: site_moa_amngt
    type: string
    description: "Nom de la maîtrise d'ouvrage en charge de l'aménagement."
  - name: site_moa_comm
    type: string
    description: "Nom de la maîtrise d'ouvrage en charge de la commercialisation."
  - name: site_uf_nbre
    type: integer
    description: "Nombre d'unités foncières du site économique (obligatoire si ZAE)."
  - name: site_uf_vacant_nbre
    type: integer
    description: "Nombre d'unités foncières vacantes du site économique."
  - name: site_taux_vacance
    type: integer
    description: "Taux de vacance de la ZAE suivant article L318-8-2 CU (pourcentage)."
  - name: site_uf_bati_nbre
    type: integer
    description: "Nombre d'unités foncières bâties."
  - name: site_nb_etab
    type: integer
    description: "Nombre d'établissements économiques (hors SCI) dans le site éco."
  - name: site_nb_emploi
    type: integer
    description: "Estimation du nombre d'emplois du site économique."
  - name: site_geomsurf
    type: string
    description: "Multi géométries surfaciques du périmètre du site économique au format GeoJSON."
  - name: site_geompoint
    type: string
    description: "Coordonnées géographiques du centroïde du site économique au format GeoJSON."
  - name: site_media
    type: string
    description: "URL pointant vers un (des) média(s) : photo, vidéo, etc. du site éco."
  - name: site_surf_comm_dispo
    type: number
    description: "Surface disponible à la commercialisation, en hectare."
  - name: site_surf_projet
    type: number
    description: "Surface réservée pour des projets en cours, en hectare."

groups:
  - name: vocations
    description: "Détail des vocations d'activités représentées sur le site."
    attributes:
      - name: site_voca_industrielle
        type: string
        description: "Le site comprend (oui / non) au moins une activité industrielle."
      - name: site_voca_commerciale
        type: string
        description: "Le site comprend (oui / non) au moins une activité commerciale."
      - name: site_voca_tertiaire
        type: string
        description: "Le site comprend (oui / non) au moins une activité tertiaire."
      - name: site_voca_artisanale
        type: string
        description: "Le site comprend (oui / non) au moins une activité artisanale."
      - name: site_voca_touristique
        type: string
        description: "Le site comprend (oui / non) au moins une activité touristique."
      - name: site_voca_portuaire
        type: string
        description: "Le site comprend (oui / non) au moins une activité portuaire."
      - name: site_voca_aeroportuaire
        type: string
        description: "Le site comprend (oui / non) au moins une activité aéroportuaire."
  - name: reseaux
    description: "Équipements et réseaux disponibles sur le site."
    attributes:
      - name: reseau_eau_pluviale
        type: string
        description: "Le site est équipé (oui / non) d'un réseau d'eau pluviale."
      - name: reseau_eau_potable
        type: string
        description: "Le site est équipé (oui / non) d'un réseau d'eau potable."
      - name: reseau_assainissement
        type: string
        description: "Le site est équipé (oui / non) d'un réseau d'assainissement."
      - name: reseau_gaz
        type: string
        description: "Le site est équipé (oui / non) d'un réseau de gaz."
      - name: reseau_electrique
        type: string
        description: "Le site est équipé (oui / non) d'un réseau électrique."
      - name: reseau_fibre_optique
        type: string
        description: "Le site est équipé (oui / non) d'un réseau de fibre optique."
      - name: reseau_fret_ferroviaire
        type: string
        description: "Présence (oui / non) d'une Installation Terminale Embranchée (ITE)."
      - name: reseau_fluvial
        type: string
        description: "Présence (oui / non) d'un quai fluvial."
  - name: desserte
    description: "Infrastructures d'accès et transports à proximité."
    attributes:
      - name: desserte_tc
        type: string
        description: "Présence (oui / non) d'une desserte en transport en commun."
      - name: desserte_route_nom
        type: string
        description: "Libellé de la desserte routière principale."
      - name: autoroute_nom
        type: string
        description: "Libellé de l'autoroute la plus proche."
      - name: autoroute_echang_dist
        type: integer
        description: "Distance de l'échangeur autoroutier le plus proche."
      - name: gare_nom
        type: string
        description: "Nom de la gare de voyageurs la plus proche."
      - name: gare_dist
        type: integer
        description: "Distance (en km) de la gare de voyageurs la plus proche, par la route."
      - name: gare_fret_nom
        type: string
        description: "Nom de la gare de fret la plus proche."
      - name: gare_fret_dist
        type: integer
        description: "Distance (en km) de la gare de fret la plus proche, par la route."
      - name: aeroport_nom
        type: string
        description: "Nom de l'aéroport le plus proche."
      - name: aeroport_dist
        type: integer
        description: "Distance (en km) de l'aéroport le plus proche, par la route."
      - name: port_nom
        type: string
        description: "Nom du port maritime ou fluvial le plus proche."
      - name: port_dist
        type: integer
        description: "Distance (en km) du port maritime ou fluvial le plus proche, par la route."
