name: parcelle_disponible
description: "Parcelle cadastrale disponible au sein d'un site économique."

attributes:
  - name: Id_site_eco
    type: string
    description: "Identifiant du site économique de rattachement."
    origin:
      from: [site_economique.Id_site_eco]
      formula: site_economique.Id_site_eco
    example: "ECO_1"
  - name: Id_parcelle
    type: string
    description: "Identifiant cadastral de la parcelle disponible."
    example: "09332000ZL0324"

groups: []